[platformio]
default_envs = heltec_wifi_lora_32_V3

[env:heltec_wifi_lora_32_V3]
platform = espressif32@6.13.0
board = heltec_wifi_lora_32_V3
framework = espidf
upload_protocol = esptool
upload_port = /dev/ttyUSB0
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = https://github.com/olikraus/u8g2.git#ab9e48b2228351e9476682a70b7f3ee4909cd585
extra_scripts = pre:tools/espidf_requirements.py, pre:tools/env_config.py, pre:tools/esptool_remote.py
board_build.sdkconfig = sdkconfig.defaults
board_build.partitions = partitions.csv
